<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景透過ツール</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, #f5f9ff, #f2f4f8);
            color: #121826;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px;
        }
        .app {
            width: min(1200px, 100%);
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 18px 35px rgba(15, 34, 58, 0.12);
            padding: 36px;
            display: grid;
            gap: 28px;
        }
        .app__header {
            display: flex;
            align-items: baseline;
            gap: 20px;
            flex-wrap: wrap;
        }
        .app__header h1 {
            margin: 0;
            font-size: clamp(1.8rem, 2.2vw + 1rem, 2.6rem);
            letter-spacing: -0.02em;
        }
        .app__header a {
            color: #3258ff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .app__header a:hover { text-decoration: underline; }
        .app__layout {
            display: grid;
            gap: 28px;
            grid-template-columns: 300px 1fr;
        }
        @media (max-width: 960px) {
            .app__layout { grid-template-columns: 1fr; }
        }
        .panel {
            background: #f7f9fd;
            border-radius: 16px;
            padding: 24px;
            display: grid;
            gap: 18px;
            border: 1px solid #e2e8f0;
            align-content: start;
        }
        .panel h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #1f2a44;
        }
        .panel label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #29344e;
        }
        .panel input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 2px dashed #b6c2da;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            color: #394661;
            cursor: pointer;
        }
        .hint {
            font-size: 0.85rem;
            color: #5f6c86;
            line-height: 1.4;
            margin: 0;
        }
        .warning {
            font-size: 0.82rem;
            color: #b45309;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 8px 12px;
            line-height: 1.4;
            margin: 0;
        }
        button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-size: 0.95rem;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }
        .btn-primary {
            background: #3258ff;
            color: white;
            box-shadow: 0 10px 18px rgba(50, 88, 255, 0.3);
        }
        .btn-secondary {
            background: #eef2ff;
            color: #2740b8;
            box-shadow: 0 10px 16px rgba(39, 64, 184, 0.12);
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }

        .ref-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid #cbd5f1;
            flex-shrink: 0;
        }
        .color-hex {
            font-family: monospace;
            font-size: 0.9rem;
            color: #394661;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #3258ff;
        }
        .slider-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #29344e;
            min-width: 30px;
            text-align: right;
        }

        .bg-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .bg-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            padding: 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #f7f9fd;
            box-shadow: none;
            transition: border-color 0.15s;
        }
        .bg-btn.active {
            border-color: #3258ff;
            box-shadow: 0 0 0 2px rgba(50, 88, 255, 0.2);
        }
        .bg-btn:hover:not(:disabled) { transform: none; border-color: #8899cc; }

        .toggle-group {
            display: flex;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #cbd5f1;
        }
        .toggle-group button {
            flex: 1;
            border-radius: 0;
            padding: 8px 12px;
            border: none;
            background: #f7f9fd;
            color: #536079;
            font-size: 0.88rem;
            box-shadow: none;
        }
        .toggle-group button.active {
            background: #3258ff;
            color: white;
        }
        .toggle-group button:hover:not(:disabled):not(.active) {
            background: #e8eeff;
            transform: none;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .preview-toolbar {
            display: flex;
            justify-content: flex-end;
        }
        .compare-area {
            display: flex;
            gap: 16px;
        }
        .compare-area.column {
            flex-direction: column;
        }
        .compare-panel {
            flex: 1;
            background: #0b1529;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }
        .compare-panel__label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .compare-panel canvas {
            align-self: flex-start;
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 45vh;
            display: block;
            border-radius: 8px;
        }
        #original-canvas { cursor: crosshair; }
        .canvas-placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.9rem;
            text-align: center;
            padding: 48px 20px;
            margin: 0;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="app">
        <header class="app__header">
            <h1>背景透過ツール</h1>
            <a href="index.html">← リサイズツール</a>
        </header>
        <section class="app__layout">
            <aside class="panel">
                <div>
                    <label for="file-input">画像ファイルを選択</label>
                    <input type="file" id="file-input" accept="image/*">
                    <p class="hint">ドラッグ＆ドロップ・クリップボード貼り付けにも対応しています。</p>
                </div>

                <div>
                    <label>基準色</label>
                    <div class="ref-color-row">
                        <div class="color-swatch" id="ref-color-swatch"></div>
                        <span class="color-hex" id="ref-color-hex">#FFFFFF</span>
                    </div>
                    <p class="hint" style="margin-top:6px;">元画像をクリックして色を再指定できます。</p>
                </div>

                <div>
                    <label for="threshold-slider">しきい値</label>
                    <div class="slider-row">
                        <input type="range" id="threshold-slider" min="0" max="255" value="30">
                        <span class="slider-value" id="threshold-value">30</span>
                    </div>
                </div>

                <div>
                    <label>プレビュー背景</label>
                    <div class="bg-selector" id="bg-selector">
                        <button class="bg-btn active" data-bg="checker" title="市松模様（透明）">⊞</button>
                        <button class="bg-btn" data-bg="#000000" title="黒" style="background:#000;border-color:#444;"></button>
                        <button class="bg-btn" data-bg="#ff69b4" title="ピンク" style="background:#ff69b4;border-color:#ff69b4;"></button>
                        <button class="bg-btn" data-bg="#00aa44" title="緑" style="background:#00aa44;border-color:#00aa44;"></button>
                        <button class="bg-btn" data-bg="custom" title="カスタム">🎨</button>
                        <input type="color" id="custom-bg-input" value="#ffffff" style="display:none;">
                    </div>
                </div>

                <div>
                    <label>保存形式</label>
                    <div class="toggle-group" id="format-toggle">
                        <button class="active" data-fmt="png">PNG</button>
                        <button data-fmt="bmp">BMP</button>
                    </div>
                </div>

                <div>
                    <label>保存モード</label>
                    <div class="toggle-group" id="mode-toggle">
                        <button class="active" data-mode="transparent">透過保持</button>
                        <button data-mode="composite">背景色合成</button>
                    </div>
                </div>

                <p class="warning hidden" id="bmp-warning">
                    ⚠️ BMP形式での透過保持は32bit BMPを使用します。一部のソフトウェアでは読み込めない場合があります。
                </p>

                <button class="btn-primary" id="save-btn" disabled>保存</button>
            </aside>

            <section class="preview-section" id="preview-section">
                <div class="preview-toolbar">
                    <button class="btn-secondary" id="layout-toggle-btn">上下比較に切替</button>
                </div>
                <div class="compare-area" id="compare-area">
                    <div class="compare-panel">
                        <span class="compare-panel__label">元画像</span>
                        <p class="canvas-placeholder" id="original-placeholder">画像を読み込んでください</p>
                        <canvas id="original-canvas" class="hidden"></canvas>
                    </div>
                    <div class="compare-panel">
                        <span class="compare-panel__label">処理結果</span>
                        <p class="canvas-placeholder" id="result-placeholder">画像を読み込んでください</p>
                        <canvas id="result-canvas" class="hidden"></canvas>
                    </div>
                </div>
            </section>
        </section>
    </main>
    <script>
        const fileInput       = document.getElementById('file-input');
        const refColorSwatch  = document.getElementById('ref-color-swatch');
        const refColorHex     = document.getElementById('ref-color-hex');
        const thresholdSlider = document.getElementById('threshold-slider');
        const thresholdValue  = document.getElementById('threshold-value');
        const bgSelector      = document.getElementById('bg-selector');
        const customBgInput   = document.getElementById('custom-bg-input');
        const formatToggle    = document.getElementById('format-toggle');
        const modeToggle      = document.getElementById('mode-toggle');
        const bmpWarning      = document.getElementById('bmp-warning');
        const saveBtn         = document.getElementById('save-btn');
        const layoutToggleBtn = document.getElementById('layout-toggle-btn');
        const compareArea     = document.getElementById('compare-area');
        const previewSection  = document.getElementById('preview-section');
        const originalCanvas  = document.getElementById('original-canvas');
        const resultCanvas    = document.getElementById('result-canvas');
        const originalPlaceholder = document.getElementById('original-placeholder');
        const resultPlaceholder   = document.getElementById('result-placeholder');

        let originalImageData = null;
        let processedImageData = null;
        let referenceColor = { r: 255, g: 255, b: 255 };
        let currentPreviewBg = 'checker';
        let customBgColor = '#ffffff';
        let currentFormat = 'png';
        let currentMode = 'transparent';
        let compareLayout = 'row';
        let rafId = null;

        // ---- Image loading ----

        function loadFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalCanvas.width = img.width;
                    originalCanvas.height = img.height;
                    originalCanvas.getContext('2d').drawImage(img, 0, 0);
                    originalImageData = originalCanvas.getContext('2d')
                        .getImageData(0, 0, img.width, img.height);

                    setReferenceColorFromPixel(0, 0);
                    scheduleProcessing();

                    originalPlaceholder.classList.add('hidden');
                    resultPlaceholder.classList.add('hidden');
                    originalCanvas.classList.remove('hidden');
                    resultCanvas.classList.remove('hidden');
                    saveBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) loadFile(e.target.files[0]);
        });

        previewSection.addEventListener('dragover', (e) => e.preventDefault());
        previewSection.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer?.files?.[0];
            if (file) loadFile(file);
        });

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items || [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) {
                    const blob = items[i].getAsFile();
                    if (blob) { loadFile(blob); break; }
                }
            }
        });

        // ---- Reference color ----

        function setReferenceColorFromPixel(x, y) {
            if (!originalImageData) return;
            const idx = (y * originalImageData.width + x) * 4;
            referenceColor = {
                r: originalImageData.data[idx],
                g: originalImageData.data[idx + 1],
                b: originalImageData.data[idx + 2],
            };
            updateRefColorUI();
        }

        function updateRefColorUI() {
            const hex = rgbToHex(referenceColor.r, referenceColor.g, referenceColor.b);
            refColorSwatch.style.backgroundColor = hex;
            refColorHex.textContent = hex.toUpperCase();
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
        }

        originalCanvas.addEventListener('click', (e) => {
            if (!originalImageData) return;
            const rect = originalCanvas.getBoundingClientRect();
            const scaleX = originalCanvas.width / rect.width;
            const scaleY = originalCanvas.height / rect.height;
            const x = Math.min(Math.floor((e.clientX - rect.left) * scaleX), originalImageData.width - 1);
            const y = Math.min(Math.floor((e.clientY - rect.top) * scaleY), originalImageData.height - 1);
            setReferenceColorFromPixel(x, y);
            scheduleProcessing();
        });

        // ---- Threshold ----

        thresholdSlider.addEventListener('input', () => {
            thresholdValue.textContent = thresholdSlider.value;
            scheduleProcessing();
        });

        // ---- Processing ----

        function scheduleProcessing() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
                processImage();
                rafId = null;
            });
        }

        function processImage() {
            if (!originalImageData) return;
            const { width, height, data } = originalImageData;
            const newData = new Uint8ClampedArray(data);
            const { r: refR, g: refG, b: refB } = referenceColor;
            const thresh = parseInt(thresholdSlider.value, 10);

            for (let i = 0; i < newData.length; i += 4) {
                const dr = Math.abs(newData[i]     - refR);
                const dg = Math.abs(newData[i + 1] - refG);
                const db = Math.abs(newData[i + 2] - refB);
                if (Math.max(dr, dg, db) <= thresh) {
                    newData[i + 3] = 0;
                }
            }

            processedImageData = new ImageData(newData, width, height);
            renderResult();
        }

        // ---- Result rendering ----

        function renderResult() {
            if (!processedImageData) return;
            const { width, height } = processedImageData;
            resultCanvas.width = width;
            resultCanvas.height = height;
            const ctx = resultCanvas.getContext('2d');

            drawPreviewBackground(ctx, width, height);

            const tmp = document.createElement('canvas');
            tmp.width = width;
            tmp.height = height;
            tmp.getContext('2d').putImageData(processedImageData, 0, 0);
            ctx.drawImage(tmp, 0, 0);
        }

        function drawPreviewBackground(ctx, width, height) {
            if (currentPreviewBg === 'checker') {
                drawCheckerboard(ctx, width, height);
            } else if (currentPreviewBg === 'custom') {
                ctx.fillStyle = customBgColor;
                ctx.fillRect(0, 0, width, height);
            } else {
                ctx.fillStyle = currentPreviewBg;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function drawCheckerboard(ctx, width, height) {
            const size = 8;
            for (let y = 0; y < height; y += size) {
                for (let x = 0; x < width; x += size) {
                    ctx.fillStyle = ((Math.floor(x / size) + Math.floor(y / size)) % 2 === 0)
                        ? '#cccccc' : '#ffffff';
                    ctx.fillRect(x, y, Math.min(size, width - x), Math.min(size, height - y));
                }
            }
        }

        // ---- Preview background selection ----

        bgSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('.bg-btn');
            if (!btn) return;
            const bg = btn.dataset.bg;
            if (bg === 'custom') {
                customBgInput.click();
                return;
            }
            currentPreviewBg = bg;
            document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderResult();
        });

        customBgInput.addEventListener('input', () => {
            customBgColor = customBgInput.value;
            currentPreviewBg = 'custom';
            document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-bg="custom"]').classList.add('active');
            renderResult();
        });

        // ---- Format / Mode toggle ----

        formatToggle.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-fmt]');
            if (!btn) return;
            currentFormat = btn.dataset.fmt;
            formatToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            updateWarning();
        });

        modeToggle.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-mode]');
            if (!btn) return;
            currentMode = btn.dataset.mode;
            modeToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            updateWarning();
        });

        function updateWarning() {
            bmpWarning.classList.toggle('hidden', !(currentFormat === 'bmp' && currentMode === 'transparent'));
        }

        // ---- Layout toggle ----

        layoutToggleBtn.addEventListener('click', () => {
            if (compareLayout === 'row') {
                compareLayout = 'column';
                compareArea.classList.add('column');
                layoutToggleBtn.textContent = '左右比較に切替';
            } else {
                compareLayout = 'row';
                compareArea.classList.remove('column');
                layoutToggleBtn.textContent = '上下比較に切替';
            }
        });

        // ---- Save ----

        saveBtn.addEventListener('click', () => {
            if (!processedImageData) return;
            const { width, height } = processedImageData;

            const srcCanvas = document.createElement('canvas');
            srcCanvas.width = width;
            srcCanvas.height = height;
            srcCanvas.getContext('2d').putImageData(processedImageData, 0, 0);

            const out = document.createElement('canvas');
            out.width = width;
            out.height = height;
            const ctx = out.getContext('2d');

            if (currentMode === 'composite') {
                if (currentPreviewBg === 'checker') {
                    ctx.fillStyle = '#ffffff';
                } else if (currentPreviewBg === 'custom') {
                    ctx.fillStyle = customBgColor;
                } else {
                    ctx.fillStyle = currentPreviewBg;
                }
                ctx.fillRect(0, 0, width, height);
            }
            ctx.drawImage(srcCanvas, 0, 0);

            const link = document.createElement('a');
            link.download = `bg-removed.${currentFormat}`;

            if (currentFormat === 'bmp') {
                const blob = currentMode === 'transparent'
                    ? canvasToBmpBlobAlpha(out)
                    : canvasToBmpBlob(out);
                link.href = URL.createObjectURL(blob);
                link.click();
            } else {
                out.toBlob((blob) => {
                    link.href = URL.createObjectURL(blob);
                    link.click();
                }, 'image/png');
            }
        });

        // ---- BMP encoding (24bit, no alpha) ----

        function canvasToBmpBlob(canvas) {
            const width = canvas.width;
            const height = canvas.height;
            const pixels = canvas.getContext('2d').getImageData(0, 0, width, height).data;
            const rowSize = Math.floor((width * 3 + 3) / 4) * 4;
            const pixelDataSize = rowSize * height;
            const fileSize = 54 + pixelDataSize;
            const buf = new ArrayBuffer(fileSize);
            const v = new DataView(buf);
            v.setUint8(0, 0x42); v.setUint8(1, 0x4d);
            v.setUint32(2, fileSize, true);
            v.setUint32(6, 0, true);
            v.setUint32(10, 54, true);
            v.setUint32(14, 40, true);
            v.setInt32(18, width, true);
            v.setInt32(22, height, true);
            v.setUint16(26, 1, true);
            v.setUint16(28, 24, true);
            v.setUint32(30, 0, true);
            v.setUint32(34, pixelDataSize, true);
            v.setInt32(38, 0, true); v.setInt32(42, 0, true);
            v.setUint32(46, 0, true); v.setUint32(50, 0, true);
            for (let row = 0; row < height; row++) {
                const dstRow = height - 1 - row;
                const rowBase = 54 + dstRow * rowSize;
                for (let col = 0; col < width; col++) {
                    const src = (row * width + col) * 4;
                    const dst = rowBase + col * 3;
                    v.setUint8(dst,     pixels[src + 2]);
                    v.setUint8(dst + 1, pixels[src + 1]);
                    v.setUint8(dst + 2, pixels[src]);
                }
            }
            return new Blob([buf], { type: 'image/bmp' });
        }

        // ---- BMP encoding (32bit BGRA, BITMAPV4HEADER) ----

        function canvasToBmpBlobAlpha(canvas) {
            const width = canvas.width;
            const height = canvas.height;
            const pixels = canvas.getContext('2d').getImageData(0, 0, width, height).data;
            const rowSize = width * 4;
            const pixelDataSize = rowSize * height;
            const headerSize = 122; // 14 (file header) + 108 (BITMAPV4HEADER)
            const fileSize = headerSize + pixelDataSize;
            const buf = new ArrayBuffer(fileSize);
            const v = new DataView(buf);
            // File header
            v.setUint8(0, 0x42); v.setUint8(1, 0x4d);
            v.setUint32(2, fileSize, true);
            v.setUint32(6, 0, true);
            v.setUint32(10, headerSize, true);
            // BITMAPV4HEADER
            v.setUint32(14, 108, true);
            v.setInt32(18, width, true);
            v.setInt32(22, height, true);
            v.setUint16(26, 1, true);
            v.setUint16(28, 32, true);
            v.setUint32(30, 3, true); // BI_BITFIELDS
            v.setUint32(34, pixelDataSize, true);
            v.setInt32(38, 0, true); v.setInt32(42, 0, true);
            v.setUint32(46, 0, true); v.setUint32(50, 0, true);
            // Color channel masks
            v.setUint32(54, 0x00FF0000, true); // R
            v.setUint32(58, 0x0000FF00, true); // G
            v.setUint32(62, 0x000000FF, true); // B
            v.setUint32(66, 0xFF000000, true); // A
            // Bytes 70–121: CSType, endpoints, gamma — zeroed by ArrayBuffer
            // Pixel data: bottom-to-top, BGRA
            for (let row = 0; row < height; row++) {
                const dstRow = height - 1 - row;
                const rowBase = headerSize + dstRow * rowSize;
                for (let col = 0; col < width; col++) {
                    const src = (row * width + col) * 4;
                    const dst = rowBase + col * 4;
                    v.setUint8(dst,     pixels[src + 2]);
                    v.setUint8(dst + 1, pixels[src + 1]);
                    v.setUint8(dst + 2, pixels[src]);
                    v.setUint8(dst + 3, pixels[src + 3]);
                }
            }
            return new Blob([buf], { type: 'image/bmp' });
        }

        updateRefColorUI();
    </script>
</body>
