<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カードワース用画像ファイル縮小ツール</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, #f5f9ff, #f2f4f8);
            color: #121826;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .app {
            width: min(1080px, 100%);
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 18px 35px rgba(15, 34, 58, 0.12);
            padding: 36px;
            display: grid;
            gap: 28px;
        }
        .app__header h1 {
            margin: 0;
            font-size: clamp(1.8rem, 2.2vw + 1rem, 2.6rem);
            letter-spacing: -0.02em;
        }
        .app__header p {
            margin: 8px 0 0;
            color: #536079;
            font-size: 1rem;
        }
        .app__layout {
            display: grid;
            gap: 28px;
            grid-template-columns: 320px 1fr;
        }
        @media (max-width: 960px) {
            .app__layout {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #f7f9fd;
            border-radius: 16px;
            padding: 24px;
            display: grid;
            gap: 18px;
            border: 1px solid #e2e8f0;
        }
        .panel h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #1f2a44;
        }
        .panel label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #29344e;
        }
        .panel input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 2px dashed #b6c2da;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            color: #394661;
            cursor: pointer;
        }
        .panel input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #cbd5f1;
            font-size: 0.95rem;
        }
        .hint {
            font-size: 0.85rem;
            color: #5f6c86;
            line-height: 1.4;
        }
        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-size: 0.95rem;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }
        .btn-primary {
            background: #3258ff;
            color: white;
            box-shadow: 0 10px 18px rgba(50, 88, 255, 0.3);
        }
        .btn-secondary {
            background: #eef2ff;
            color: #2740b8;
            box-shadow: 0 10px 16px rgba(39, 64, 184, 0.12);
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .canvas-card {
            background: #0b1529;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 420px;
        }
        .canvas-card.dragover {
            background: #10203d;
            box-shadow: 0 0 0 2px rgba(80, 180, 255, 0.4) inset, 0 18px 35px rgba(15, 34, 58, 0.22);
        }
        #canvas-container {
            position: relative;
            border-radius: 12px;
            border: 2px dashed rgba(255, 255, 255, 0.35);
            background: radial-gradient(circle at top, rgba(255, 255, 255, 0.16), transparent 55%);
            padding: 12px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        #canvas-container.dragover {
            border-color: rgba(80, 180, 255, 0.9);
            background: rgba(43, 121, 255, 0.25);
        }
        #canvas {
            max-width: min(640px, 80vw);
            max-height: 70vh;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: #101d38;
        }
        .status-bar {
            position: absolute;
            left: 24px;
            bottom: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.82);
        }
        .status-pill {
            background: rgba(12, 23, 44, 0.65);
            border-radius: 999px;
            padding: 6px 14px;
        }
        .hidden {
            display: none !important;
        }
        .canvas-placeholder {
            color: rgba(255, 255, 255, 0.72);
            text-align: center;
            line-height: 1.5;
            max-width: 420px;
            margin: 0 auto;
            font-size: 1rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="app__header">
            <h1>カードワース用画像ファイル縮小ツール</h1>
            <p>画像を読み込み、範囲を調整し、希望サイズでBMP/PNGとしてダウンロードできます。</p>
        </header>
        <section class="app__layout">
            <aside class="panel">
                <div>
                    <label for="file-input">画像ファイルを選択</label>
                    <input type="file" id="file-input" accept="image/*">
                    <p class="hint">ドラッグ＆ドロップまたはクリップボードからの貼り付けにも対応しています。</p>
                </div>
                <div>
                    <h2>出力サイズ</h2>
                    <div class="dimension-grid">
                        <div>
                            <label for="output-width">幅 (px)</label>
                            <input type="number" id="output-width" min="1" value="74">
                        </div>
                        <div>
                            <label for="output-height">高さ (px)</label>
                            <input type="number" id="output-height" min="1" value="94">
                        </div>
                    </div>
                    <p class="hint">数値を変更すると選択範囲の比率が自動で更新されます。</p>
                </div>
                <div class="button-row">
                    <button class="btn-secondary" id="reset-selection-btn" disabled>選択範囲を中央にリセット</button>
                </div>
                <div class="button-row">
                    <button class="btn-primary" id="download-bmp-btn" disabled>BMPとして保存</button>
                    <button class="btn-primary" id="download-png-btn" disabled>PNGとして保存</button>
                </div>
            </aside>
            <section class="canvas-card">
                <p id="canvas-placeholder" class="canvas-placeholder">ここに画像をドロップするか、左側から画像ファイルを選択してください。</p>
                <div id="canvas-container" class="hidden">
                    <canvas id="canvas"></canvas>
                </div>
                <div class="status-bar hidden" id="status-bar">
                    <span class="status-pill" id="status-dimensions">選択範囲: -</span>
                    <span class="status-pill" id="status-output">出力サイズ: 74 × 94</span>
                </div>
            </section>
        </section>
    </main>
    <script src="https://unpkg.com/pica/dist/pica.min.js"></script>
    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const canvasContainer = document.getElementById('canvas-container');
        const canvasCard = document.querySelector('.canvas-card');
        const placeholder = document.getElementById('canvas-placeholder');
        const outputWidthInput = document.getElementById('output-width');
        const outputHeightInput = document.getElementById('output-height');
        const resetSelectionBtn = document.getElementById('reset-selection-btn');
        const downloadBmpBtn = document.getElementById('download-bmp-btn');
        const downloadPngBtn = document.getElementById('download-png-btn');
        const statusBar = document.getElementById('status-bar');
        const statusDimensions = document.getElementById('status-dimensions');
        const statusOutput = document.getElementById('status-output');

        const EDGE_HANDLE_SIZE = 14;
        const DEFAULT_OUTPUT_WIDTH = 74;
        const DEFAULT_OUTPUT_HEIGHT = 94;
        const INITIAL_SELECTION_SCALE = 0.6;
        const MIN_SELECTION_SIZE = 40;
        const MIN_RESIZE_SIZE = 20;

        const ctx = canvas.getContext('2d');
        const img = new Image();
        const targetDimensions = {
            width: DEFAULT_OUTPUT_WIDTH,
            height: DEFAULT_OUTPUT_HEIGHT
        };
        let selectionBox = { x: 10, y: 10, width: DEFAULT_OUTPUT_WIDTH, height: DEFAULT_OUTPUT_HEIGHT };
        let dragging = false;
        let resizing = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let interactionsBound = false;

        function normalizeDimensionInput(input, fallback) {
            const value = parseInt(input.value, 10);
            const safeValue = Number.isFinite(value) && value > 0 ? value : fallback;
            if (input.value !== String(safeValue)) {
                input.value = safeValue;
            }
            return safeValue;
        }

        function ensureTargetDimensions() {
            const width = normalizeDimensionInput(outputWidthInput, DEFAULT_OUTPUT_WIDTH);
            const height = normalizeDimensionInput(outputHeightInput, DEFAULT_OUTPUT_HEIGHT);
            const changed = width !== targetDimensions.width || height !== targetDimensions.height;
            targetDimensions.width = width;
            targetDimensions.height = height;
            if (changed) {
                updateOutputStatus();
            }
            return targetDimensions;
        }

        function updateOutputStatus() {
            statusOutput.textContent = `出力サイズ: ${targetDimensions.width} × ${targetDimensions.height}`;
        }

        function getPointerPosition(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width ? canvas.width / rect.width : 1;
            const scaleY = rect.height ? canvas.height / rect.height : 1;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;
            return { x, y };
        }

        function getAspectRatio() {
            const { width, height } = ensureTargetDimensions();
            const ratio = height / width;
            return Number.isFinite(ratio) && ratio > 0 ? ratio : 1;
        }

        function setDragState(isActive) {
            const method = isActive ? 'add' : 'remove';
            canvasCard.classList[method]('dragover');
            canvasContainer.classList[method]('dragover');
        }

        function enableInteractiveElements() {
            canvasContainer.classList.remove('hidden');
            statusBar.classList.remove('hidden');
            placeholder.classList.add('hidden');
            setDragState(false);
            updateOutputStatus();
            downloadBmpBtn.disabled = false;
            downloadPngBtn.disabled = false;
            resetSelectionBtn.disabled = false;
        }

        function initializeInteractions() {
            if (interactionsBound) return;

            canvas.addEventListener('mousedown', startInteraction);
            canvas.addEventListener('mouseup', stopInteraction);
            canvas.addEventListener('mouseleave', stopInteraction);
            canvas.addEventListener('mousemove', dragOrResize);

            downloadBmpBtn.addEventListener('click', () => downloadCroppedImage('bmp'));
            downloadPngBtn.addEventListener('click', () => downloadCroppedImage('png'));
            resetSelectionBtn.addEventListener('click', resetSelectionBox);

            outputWidthInput.addEventListener('change', handleDimensionChange);
            outputHeightInput.addEventListener('change', handleDimensionChange);

            interactionsBound = true;
        }

        function handleDimensionChange() {
            ensureTargetDimensions();
            if (!img.width) {
                return;
            }
            resizeSelectionBoxToAspect();
            drawSelectionBox();
        }

        function resetSelectionBox() {
            resizeSelectionBoxToAspect();
            drawSelectionBox();
        }

        function resizeSelectionBoxToAspect() {
            const aspectRatio = getAspectRatio();

            let width = Math.min(canvas.width * INITIAL_SELECTION_SCALE, canvas.width);
            let height = width * aspectRatio;

            if (height > canvas.height * INITIAL_SELECTION_SCALE) {
                height = Math.min(canvas.height * INITIAL_SELECTION_SCALE, canvas.height);
                width = height / aspectRatio;
            }

            width = Math.max(width, MIN_SELECTION_SIZE);
            height = Math.max(height, MIN_SELECTION_SIZE);

            if (width > canvas.width) {
                width = canvas.width;
                height = width * aspectRatio;
            }

            if (height > canvas.height) {
                height = canvas.height;
                width = height / aspectRatio;
            }

            selectionBox = {
                x: (canvas.width - width) / 2,
                y: (canvas.height - height) / 2,
                width,
                height
            };
        }

        function drawSelectionBox() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            ctx.save();
            ctx.strokeStyle = '#ff7a59';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.strokeRect(selectionBox.x, selectionBox.y, selectionBox.width, selectionBox.height);
            ctx.restore();
            statusDimensions.textContent = `選択範囲: ${Math.round(selectionBox.width)} × ${Math.round(selectionBox.height)}`;
        }

        function startInteraction(event) {
            const { x: mouseX, y: mouseY } = getPointerPosition(event);
            const edgeSize = EDGE_HANDLE_SIZE;

            if (mouseX >= selectionBox.x + selectionBox.width - edgeSize &&
                mouseX <= selectionBox.x + selectionBox.width &&
                mouseY >= selectionBox.y + selectionBox.height - edgeSize &&
                mouseY <= selectionBox.y + selectionBox.height) {
                resizing = true;
                dragging = false;
                canvas.style.cursor = 'nwse-resize';
            } else if (
                mouseX >= selectionBox.x && mouseX <= selectionBox.x + selectionBox.width &&
                mouseY >= selectionBox.y && mouseY <= selectionBox.y + selectionBox.height
            ) {
                dragging = true;
                resizing = false;
                dragOffsetX = mouseX - selectionBox.x;
                dragOffsetY = mouseY - selectionBox.y;
                canvas.style.cursor = 'move';
            }
        }

        function dragOrResize(event) {
            const { x: mouseX, y: mouseY } = getPointerPosition(event);
            const aspectRatio = getAspectRatio();
            const edgeSize = EDGE_HANDLE_SIZE;
            const nearCorner = mouseX >= selectionBox.x + selectionBox.width - edgeSize &&
                mouseX <= selectionBox.x + selectionBox.width &&
                mouseY >= selectionBox.y + selectionBox.height - edgeSize &&
                mouseY <= selectionBox.y + selectionBox.height;
            const insideSelection = mouseX >= selectionBox.x &&
                mouseX <= selectionBox.x + selectionBox.width &&
                mouseY >= selectionBox.y &&
                mouseY <= selectionBox.y + selectionBox.height;

            if (!dragging && !resizing) {
                if (nearCorner) {
                    canvas.style.cursor = 'nwse-resize';
                } else if (insideSelection) {
                    canvas.style.cursor = 'move';
                } else {
                    canvas.style.cursor = 'default';
                }
                return;
            }

            if (dragging) {
                canvas.style.cursor = 'move';
                let nextX = mouseX - dragOffsetX;
                let nextY = mouseY - dragOffsetY;

                nextX = Math.min(Math.max(nextX, 0), canvas.width - selectionBox.width);
                nextY = Math.min(Math.max(nextY, 0), canvas.height - selectionBox.height);

                selectionBox.x = nextX;
                selectionBox.y = nextY;
            } else if (resizing) {
                canvas.style.cursor = 'nwse-resize';
                let newWidth = Math.max(mouseX - selectionBox.x, MIN_RESIZE_SIZE);
                let newHeight = newWidth * aspectRatio;

                if (selectionBox.x + newWidth > canvas.width) {
                    newWidth = canvas.width - selectionBox.x;
                    newHeight = newWidth * aspectRatio;
                }
                if (selectionBox.y + newHeight > canvas.height) {
                    newHeight = canvas.height - selectionBox.y;
                    newWidth = newHeight / aspectRatio;
                }

                if (newWidth >= MIN_RESIZE_SIZE && newHeight >= MIN_RESIZE_SIZE) {
                    selectionBox.width = newWidth;
                    selectionBox.height = newHeight;
                }
            }

            drawSelectionBox();
        }

        function stopInteraction() {
            dragging = false;
            resizing = false;
            canvas.style.cursor = 'default';
        }

        function downloadCroppedImage(format) {
            if (!img.width) return;

            const { width: outputWidth, height: outputHeight } = ensureTargetDimensions();
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = Math.round(selectionBox.width);
            tempCanvas.height = Math.round(selectionBox.height);
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.drawImage(
                img,
                selectionBox.x,
                selectionBox.y,
                selectionBox.width,
                selectionBox.height,
                0,
                0,
                tempCanvas.width,
                tempCanvas.height
            );

            const pica = window.pica();
            const outputCanvas = document.createElement('canvas');
            outputCanvas.width = outputWidth;
            outputCanvas.height = outputHeight;

            pica.resize(tempCanvas, outputCanvas)
                .then(() => {
                    const link = document.createElement('a');
                    link.download = `resized-image.${format}`;
                    outputCanvas.toBlob((blob) => {
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    }, `image/${format}`);
                })
                .catch((error) => {
                    console.error('画像のリサイズに失敗しました:', error);
                });
        }

        // ファイル選択
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                loadImageFromSource(file);
            }
        });

        // ドラッグ＆ドロップ
        function handleDragOver(event) {
            event.preventDefault();
            setDragState(true);
        }

        function handleDragLeave(event) {
            event.preventDefault();
            const related = event.relatedTarget;
            if (related && canvasCard.contains(related)) {
                return;
            }
            setDragState(false);
        }

        function handleDrop(event) {
            event.preventDefault();
            setDragState(false);
            const file = event.dataTransfer?.files?.[0];
            if (file) {
                loadImageFromSource(file);
            }
        }

        [canvasCard, canvasContainer].forEach((target) => {
            target.addEventListener('dragover', handleDragOver);
            target.addEventListener('dragleave', handleDragLeave);
            target.addEventListener('drop', handleDrop);
        });

        // クリップボードからの貼り付けに対応
        document.addEventListener('paste', (event) => {
            const items = event.clipboardData?.items || [];
            for (let i = 0; i < items.length; i += 1) {
                if (items[i].type.includes('image')) {
                    const blob = items[i].getAsFile();
                    if (blob) {
                        loadImageFromSource(blob);
                    }
                }
            }
        });

        function loadImageFromSource(source) {
            const reader = new FileReader();
            reader.onload = (e) => {
                if (e.target?.result) {
                    img.src = e.target.result;
                }
            };
            reader.readAsDataURL(source);
        }

        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            initializeInteractions();
            ensureTargetDimensions();
            resizeSelectionBoxToAspect();
            drawSelectionBox();
            enableInteractiveElements();
        };

        updateOutputStatus();
    </script>
</body>
</html>
